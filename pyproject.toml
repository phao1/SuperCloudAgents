[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sca"
version = "0.1.0"
description = "SuperCloudAgents: a platform for hosting long-running agents in the cloud"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "temporalio>=1.8",
  "httpx>=0.27",
  "typer>=0.12",
  "pyjwt[crypto]>=2.9",
  "boto3>=1.35",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "moto[server]>=5"]

[project.scripts]
sca = "sca.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sca"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: needs Postgres and/or Docker",
  "e2e: needs the full stack running",
  "codex: needs a logged-in Codex CLI and spends model tokens",
  "k8s: needs the local kind cluster (deploy/kind)",
  "live: needs the optional compose services (profiles s3, oidc)",
  "gateway: needs the LiteLLM gateway (compose profile `gateway`) and a provider key in .env",
]

[tool.ruff]
line-length = 100
target-version = "py312"
