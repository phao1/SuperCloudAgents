split: dev
category: scheduling
instruction: |
  Production coordinators want to draft a rehearsal call and publish a frozen roster so crew
  members can see exactly who was called and for which duties.

  - Draft a call for an active production that fits the venue, with one or more distinct active
    crew members from that venue. Save the rehearsal in day, sort crew IDs and start with an
    empty roster and no published date.
  - The manager publishes once on or before rehearsal day, with the expected crew count for the
    draft. Revalidate the crew, production and venue. Reject a crew member already on a
    published call for the same day, including announced legacy paper calls even before
    migration.
  - On publish, persist a roster snapshot of person, name and duty ordered by person ID. Later
    crew edits must not rewrite the published roster.
  - The desk report section rehearsal-calls gives calls (sorted IDs of published calls on that
    exact rehearsal day at the venue) and crew_count (number of distinct crew).
  - Import announced paper calls with a publication date as version-two published calls by
    source ID, translating announced to published and expanding the crew roster from the current
    directory at import. Leave legacy records alone and make repeat import a no-op.
  - Provide the two operator interfaces, role checks, bilingual responses, and an audit entry
    for each draft and publication.

  Ship the commands as rehearsal-calls draft, rehearsal-calls publish and
  rehearsal-calls list, with the matching /v1/rehearsal-calls/<action> routes.
  The minimum roles are operator for draft and manager for publish.
  Readers can list by scope and optional status (draft, published) in ascending ID order.
  Unknown scopes return not_found and unknown statuses return bad_request.
  Register rehearsal-calls.drafted and rehearsal-calls.published.
  Use the workflow ID as the audit record_id and put scope in the event details.
  Use English and French success messages through the existing response catalogs.

  Use underscores in API field names and hyphens in CLI options.

  | Command | Arguments |
  | --- | --- |
  | draft | id (new workflow identifier), scope (venue), production (production), day (effective calendar day), crew (JSON array of crew IDs) |
  | publish | id (existing workflow identifier), day (effective calendar day), expected_count (reviewed crew count) |
  | list | scope (desk ID), status (optional) |

  The write response and list entries are saved workflow records with id, scope, status and
  version. The other workflow fields are production, day, crew, published, roster.
  Use bad_request for invalid arguments or reversed date bounds and conflict for invalid
  state transitions, capacity, stale source records or duplicate work. Rejected changes are atomic.
  Accept valid version-one workspaces even if some live workflows have already run. History
  upgrade must preserve those version-two records without importing them again.

  Keep README.md, the existing docs and tests, tools/read_v1.py,
  fixtures/workspace-v1.json and verify.py unchanged. Add an operator guide at
  docs/rehearsal-calls.md with all three command examples and a store upgrade example.
  Add at least two focused unittest tests and run python -B verify.py.
verify_command: python -B verify.py
image: python:3.12
