split: holdout
category: reconciliation
instruction: |
  Return staff need to file damage disputes for manager rulings. The finance desk needs the
  disputed exposure and the actual approved charge in the same report.

  - File one dispute for a logged return that has damage, on or after intake day. Snapshot the
    recorded damage, rate, tool, borrower and scope and preserve the operator's reason. New
    disputes are filed with waived, charge_cents and settled set to null. Filing a dispute for
    an undamaged return or filing a duplicate returns conflict (409).
  - Settle once on or after filing. A waiver must be an integer from zero through the damaged
    units. Out-of-range values and booleans return bad_request (400). Changes to the original
    rate, damage or logged status return conflict. Save charge_cents as (damaged minus waived)
    times the saved rate, the waived units and the settlement date. In the same write set the
    original return's status to closed, allowed to the waived units and settled to that date.
  - Add return-disputes to the depot report. open_cents sums damaged times rate for disputes
    filed by the report day that are still in filed status. settled_cents sums the charges
    from rulings issued by that day. Report both in integer cents.
  - Convert closed returns with damage, an allowed value (including zero) and settled date to
    settled disputes. Use the return ID for id and intake and copy its day. Map allowed to
    waived, compute charge_cents as for live records and use reason paper. Skip a return already
    referenced by the intake field of a settled dispute.

  Add return-disputes file (POST, operator), settle (POST, manager) and list (GET, reader)
  to workyard/registry.py with /v1/return-disputes/<action> routes. Wire permissions in
  workyard/policy.py. Use <group>.<action> keys with distinct en and fr success messages in
  workyard/messages.py. Register Table("return-disputes", 2) in workyard/schema.py and add
  the return-disputes section in workyard/reporting.py alongside existing sections. List by
  depot scope and optional status (filed, settled) in ascending ID order. Unknown scopes return
  not_found and unknown statuses return bad_request. Audits for the new actions are optional.

  Register a read-only converter under return-disputes in workyard/migrations.py for the existing
  manager-only store upgrade --name return-disputes (POST /v1/store/upgrade). If a live dispute
  uses a historical return's ID but refers to a different return, return the historical candidate
  so deskcore/history.py rejects the collision as conflict (409). The entire workspace stays
  untouched on conflict. On success the shared runner returns the inserted count as imported,
  sets upgrades[name] to 2, and appends store.upgraded with the upgrade name as record_id and
  version=2 and the imported count in details. A repeat returns imported=0 without rewriting
  the workspace. Preserve format 1, unrelated extensions, the old reader, the version-one
  charge report and portable exports.

  Use hyphens for underscores in CLI option names.

  | Command | Arguments |
  | --- | --- |
  | file | id (new workflow identifier), intake (logged intake ID), day (effective calendar day), reason (operator note) |
  | settle | id (existing workflow identifier), waived (damaged units to waive), day (effective calendar day) |
  | list | scope (desk ID), status (optional) |

  The write response and list entries are saved workflow records with id, scope, status and
  version. The other workflow fields are intake, tool, borrower, damaged, rate, day, reason, waived, charge_cents, settled.
  Use bad_request for invalid arguments or reversed date bounds and conflict for invalid
  state transitions, capacity, stale source records or duplicate work. Rejected changes are atomic.

  Keep README.md, the existing docs and tests, tools/read_v1.py,
  fixtures/workspace-v1.json and verify.py unchanged. Add an operator guide at
  docs/return-disputes.md with all three command examples and a store upgrade example.
  Add at least two focused unittest tests in a new tests/test_*.py file and run python -B verify.py.
verify_command: python -B verify.py
image: python:3.12
