split: dev
category: allocation
instruction: |
  Workshop coordinators need to take part of a tool model's stock out of circulation while
  repairs are underway and keep a dated record of the disposition.

  - Schedule units from a ready tool at its home depot. Save tool, units, reason, day and end,
    with status scheduled and completed and outcome initially unset. Reject reversed intervals.
    Inclusive scheduled windows for a model may share dates only if the total units blocked on
    each date fits the model's stock.
  - Complete a scheduled window once, on or after its start, with outcome ready or quarantined.
    Keep the planned dates, record the completion day in completed and free its scheduled
    capacity for future scheduling.
  - Add maintenance-windows to the desk report with blocked_units for the requested date and
    quarantined_units accumulated through that date at that depot. A completed allocation still
    counts as blocked during its original window before its completion day.
  - Convert done service-logs to completed windows keyed by the log ID. Copy scope, tool,
    units, day, end and outcome, map result_day to completed and set reason to paper. Leave
    planned and void logs in the legacy register. A done log without a valid outcome or result
    date makes the conversion fail with bad_store (422).

  Add maintenance-windows schedule (POST, operator), complete (POST, manager) and list
  (GET, reader) to workyard/registry.py with /v1/maintenance-windows/<action> routes. Wire
  permissions in workyard/policy.py. Use <group>.<action> keys with distinct en and fr success
  messages in workyard/messages.py. Register Table("maintenance-windows", 2) in workyard/schema.py
  and add the maintenance-windows section in workyard/reporting.py alongside existing sections.
  List by depot scope and optional status (scheduled, completed) in ascending ID order.
  Unknown scopes return not_found and unknown statuses return bad_request. Audits for the
  new actions are optional.

  Register a read-only converter under maintenance-windows in workyard/migrations.py for
  the existing manager-only store upgrade --name maintenance-windows (POST /v1/store/upgrade).
  Return all eligible log candidates even if their IDs already exist in version two.
  deskcore/history.py compares the records and rejects any differing row with the same ID as
  conflict (409), leaving the workspace byte-for-byte intact. On success the shared runner
  returns the inserted count as imported, sets upgrades[name] to 2, and appends store.upgraded
  with the upgrade name as record_id and version=2 and the imported count in details. A repeat
  returns imported=0 without rewriting the workspace. Preserve format 1, unrelated extensions,
  original service logs and portable exports.

  Use hyphens for underscores in CLI option names.

  | Command | Arguments |
  | --- | --- |
  | schedule | id (new workflow identifier), tool (ready tool model), day (effective calendar day), reason (workshop reason code), units (units to block), end (last blocked day) |
  | complete | id (existing workflow identifier), day (effective calendar day), outcome (workshop result) |
  | list | scope (desk ID), status (optional) |

  The write response and list entries are saved workflow records with id, scope, status and
  version. The other workflow fields are tool, day, end, units, reason, completed, outcome.
  Use bad_request for invalid arguments or reversed date bounds and conflict for invalid
  state transitions, capacity, stale source records or duplicate work. Rejected changes are atomic.
  Scheduling a retired tool returns conflict. Accept workspaces where unrelated live windows
  already exist and preserve them through the upgrade.

  Keep README.md, the existing docs and tests, tools/read_v1.py,
  fixtures/workspace-v1.json and verify.py unchanged. Add an operator guide at
  docs/maintenance-windows.md with all three command examples and a store upgrade example.
  Add at least two focused unittest tests in a new tests/test_*.py file and run python -B verify.py.
verify_command: python -B verify.py
image: python:3.12
