split: dev
category: cross-desk
instruction: |
  Box office needs to review a planned change before sending audience notices. A published
  notice must remember the old and new shows and who was told.

  - Prepare one notice per scheduled performance with an actual date or venue change. The
    destination must have enough seats and no other scheduled or moved performance on that day.
    Prepare on or before both performance dates. Record the old venue and day in previous_scope
    and previous_day, the new day in scheduled, the destination as scope and no audience or sent
    date yet.
  - Send once between preparation and the earlier performance date, inclusive. If the original
    show moved or was cancelled while pending, reject the old notice. Recheck venue capacity and
    availability. Capture the current sorted audience groups at send time and persist them in
    the notice.
  - Sending updates the version-one performance to moved at the destination and new performance
    day, with prior_scope, prior_day, reason and sent populated. Afterward, audience edits on
    the show do not change the frozen notice.
  - The performance-notices section of the destination desk report lists pending IDs as of that
    date and recipient_groups, the sorted union of groups sent notices through the date.
  - Import moved legacy shows with prior scope, prior day, reason and send date as sent notices
    keyed by the show ID. Use the old send date as preparation day when no draft is recorded.
    Skip shows already represented by live notices. Keep legacy readers working and support
    repeat runs.
  - Expose the actions and filtered notice list on the standard desk interfaces, with access
    checks, translated responses and auditable changes.

  Ship the commands as performance-notices prepare, performance-notices send and
  performance-notices list, with the matching /v1/performance-notices/<action> routes.
  The minimum roles are operator for prepare and manager for send.
  Readers can list by scope and optional status (prepared, sent) in ascending ID order.
  Unknown scopes return not_found and unknown statuses return bad_request.
  Register performance-notices.prepared and performance-notices.sent.
  Use the workflow ID as the audit record_id and put scope in the event details.
  Use English and French success messages through the existing response catalogs.

  Use underscores in API field names and hyphens in CLI options.

  | Command | Arguments |
  | --- | --- |
  | prepare | id (new workflow identifier), performance (scheduled performance), scope (new venue), scheduled (new performance date), day (effective calendar day), reason (public explanation) |
  | send | id (existing workflow identifier), day (effective calendar day) |
  | list | scope (desk ID), status (optional) |

  The write response and list entries are saved workflow records with id, scope, status and
  version. The other workflow fields are performance, production, previous_scope, previous_day, scheduled, day, reason, audience, sent.
  Use bad_request for invalid arguments or reversed date bounds and conflict for invalid
  state transitions, capacity, stale source records or duplicate work. Rejected changes are atomic.
  Accept valid version-one workspaces even if some live workflows have already run. History
  upgrade must preserve those version-two records without importing them again.

  Keep README.md, the existing docs and tests, tools/read_v1.py,
  fixtures/workspace-v1.json and verify.py unchanged. Add an operator guide at
  docs/performance-notices.md with all three command examples and a store upgrade example.
  Add at least two focused unittest tests and run python -B verify.py.
verify_command: python -B verify.py
image: python:3.12
