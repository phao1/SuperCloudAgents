split: dev
category: cross-desk
instruction: |
  Let the depot that has a tool arrange a collection at another depot. The destination desk
  needs its own collection queue and must be able to confirm who collected the tool.

  - Stage one handoff for an open reservation going to a different, existing depot on or after
    the reservation day. Record the destination as scope and retain origin, reservation, tool,
    units and borrower from the booking. A reservation can have only one handoff. A new handoff
    is staged with collected unset.
  - On collection, require the original borrower, a date at or after staging and a still-open
    source with the same units and tool. Mark the handoff collected with its collection date and
    update the original reservation's pickup, closed date and status. A second collection is a
    conflict.
  - On the desk report add reservation-handoffs with due (IDs staged by that date and not yet
    collected that day, sorted) and collected_units (units collected at that destination on or
    before the report date).
  - Import collected paper reservations with a different pickup depot and a collection date,
    using the reservation ID and reservation date for the historical handoff. Skip normal
    pickups and already represented collections.
  - Use the existing version-two extension format and named upgrade. Running it twice should add
    no rows and leave the old reader and legacy export working on the same file.

  Ship the commands as reservation-handoffs stage, reservation-handoffs collect and
  reservation-handoffs list, with the matching /v1/reservation-handoffs/<action> routes.
  The minimum roles are operator for stage and manager for collect.
  Readers can list by scope and optional status (staged, collected) in ascending ID order.
  Unknown scopes return not_found and unknown statuses return bad_request.
  Audit entries for the new actions are optional. Keep the existing upgrade audit behavior.
  Use English and French success messages through the existing response catalogs.

  Use hyphens for underscores in CLI option names.

  | Command | Arguments |
  | --- | --- |
  | stage | id (new workflow identifier), reservation (open source reservation), pickup (destination depot), day (effective calendar day) |
  | collect | id (existing workflow identifier), borrower (collecting borrower), day (effective calendar day) |
  | list | scope (desk ID), status (optional) |

  The write response and list entries are saved workflow records with id, scope, status and
  version. The other workflow fields are reservation, origin, tool, units, borrower, day, collected.
  Use bad_request for invalid arguments or reversed date bounds and conflict for invalid
  state transitions, capacity, stale source records or duplicate work. Staging with the
  original depot as the pickup is a bad_request. Rejected changes are atomic.
  Accept valid version-one workspaces even if some live workflows have already run. History
  upgrade must preserve those version-two records without importing them again.

  Keep README.md, the existing docs and tests, tools/read_v1.py,
  fixtures/workspace-v1.json and verify.py unchanged. Add an operator guide at
  docs/reservation-handoffs.md with all three command examples and a store upgrade example.
  Add at least two focused unittest tests and run python -B verify.py.
verify_command: python -B verify.py
image: python:3.12
