split: holdout
category: cross-desk
instruction: |
  An incident can outlast a field crew's shift. The outgoing lead needs to offer it to another
  crew and the receiving lead must acknowledge it before responsibility moves.

  - The current crew's lead or a manager offers an open incident to a different active crew, on
    or after incident day. Save original crew, target, priority, offer day and response
    deadline, keeping the incident station as scope. The deadline cannot precede the offer. Only
    one offer per incident.
  - Only the target crew's active lead can acknowledge, even if another member is a manager.
    Accept once on or after offer day and recheck the incident is still open with the same crew
    and priority and the target is still active.
  - Store the acknowledgement date in received and set late if it exceeds the deadline. Move the
    original version-one incident to forwarded with its new crew, former crew, received date and
    due. Transfers after the deadline still go through.
  - The station's incident-handoffs report gives awaiting IDs on that date and overdue IDs. A
    pending offer is overdue after its deadline; a received offer is overdue if it arrived late.
    Include only offers already made and return IDs in order.
  - Migrate forwarded legacy incidents with former, due and received values to acknowledged
    handoffs. Use the incident ID and day, derive lateness, preserve old readers and skip
    incidents already represented. Use the version-two named upgrade with no change on repeat.
  - Register both actions and the list, with permissions, localized messages and audited
    changes.

  Ship the commands as incident-handoffs offer, incident-handoffs acknowledge and
  incident-handoffs list, with the matching /v1/incident-handoffs/<action> routes.
  The minimum roles are operator for offer and operator for acknowledge.
  Readers can list by scope and optional status (offered, acknowledged) in ascending ID order.
  Unknown scopes return not_found and unknown statuses return bad_request.
  Register incident-handoffs.offered and incident-handoffs.acknowledged.
  Use the workflow ID as the audit record_id and put scope in the event details.
  Use English and French success messages through the existing response catalogs.

  Use underscores in API field names and hyphens in CLI options.

  | Command | Arguments |
  | --- | --- |
  | offer | id (new workflow identifier), incident (open incident), target (receiving crew), day (effective calendar day), due (response deadline) |
  | acknowledge | id (existing workflow identifier), day (effective calendar day) |
  | list | scope (desk ID), status (optional) |

  The write response and list entries are saved workflow records with id, scope, status and
  version. The other workflow fields are incident, origin, target, priority, day, due, received, late.
  Use bad_request for invalid arguments or reversed date bounds and conflict for invalid
  state transitions, capacity, stale source records or duplicate work. Rejected changes are atomic.
  Accept valid version-one workspaces even if some live workflows have already run. History
  upgrade must preserve those version-two records without importing them again.

  Keep README.md, the existing docs and tests, tools/read_v1.py,
  fixtures/workspace-v1.json and verify.py unchanged. Add an operator guide at
  docs/incident-handoffs.md with all three command examples and a store upgrade example.
  Add at least two focused unittest tests and run python -B verify.py.
verify_command: python -B verify.py
image: python:3.12
