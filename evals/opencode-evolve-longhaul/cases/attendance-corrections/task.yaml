split: holdout
category: reconciliation
instruction: |
  The payroll clerk wants to correct a worked-minute mark, with a second person reviewing the
  change. The desk must report the net correction rather than rewriting its history.

  - File a correction against a recorded mark on or after its attendance day. Keep mark, person,
    before, corrected minutes, signed delta, reason, filing day and filed_by. Reject an
    unchanged value or a second correction for the same mark.
  - Require a different person with manager permissions to sign off a filed correction on or
    after filing. If the underlying minutes or mark status changed, reject the stale correction.
    Persist the signer, signing date and signed status.
  - On signoff also update the original attendance minutes, marking it corrected with original
    minutes, reason and reviewed date. Workload reads keep using version-one marks and see the
    new minutes.
  - In the venue desk report add attendance-corrections with awaiting_review (filed and not
    signed by that date) and net_minutes (sum of signed deltas through the date). Negative
    deltas count.
  - Convert historical corrected marks with original, reviewed and reason populated to signed
    rows with the original mark ID and attendance day. Unknown actors stay null. Skip marks
    already represented, preserve legacy rows and use the repeatable named upgrade.
  - Ship the shared CLI and API actions and list with bilingual messages and an audit trail.

  Ship the commands as attendance-corrections file, attendance-corrections signoff and
  attendance-corrections list, with the matching /v1/attendance-corrections/<action> routes.
  The minimum roles are operator for file and manager for signoff.
  Readers can list by scope and optional status (filed, signed) in ascending ID order.
  Unknown scopes return not_found and unknown statuses return bad_request.
  Register attendance-corrections.filed and attendance-corrections.signed.
  Use the workflow ID as the audit record_id and put scope in the event details.
  Use English and French success messages through the existing response catalogs.

  Use underscores in API field names and hyphens in CLI options.

  | Command | Arguments |
  | --- | --- |
  | file | id (new workflow identifier), mark (attendance mark), minutes (corrected worked minutes), day (effective calendar day), reason (reason for the correction) |
  | signoff | id (existing workflow identifier), day (effective calendar day) |
  | list | scope (desk ID), status (optional) |

  The write response and list entries are saved workflow records with id, scope, status and
  version. The other workflow fields are mark, person, day, before, minutes, delta, reason, filed_by, signed_by, signed.
  Use bad_request for invalid arguments or reversed date bounds and conflict for invalid
  state transitions, capacity, stale source records or duplicate work. Rejected changes are atomic.
  Accept valid version-one workspaces even if some live workflows have already run. History
  upgrade must preserve those version-two records without importing them again.

  Keep README.md, the existing docs and tests, tools/read_v1.py,
  fixtures/workspace-v1.json and verify.py unchanged. Add an operator guide at
  docs/attendance-corrections.md with all three command examples and a store upgrade example.
  Add at least two focused unittest tests and run python -B verify.py.
verify_command: python -B verify.py
image: python:3.12
