<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperCloudAgents · 任务历史</title>
<style>
  :root {
    color-scheme: light;
    font-family: system-ui, "Microsoft YaHei", sans-serif;
    color: #17233a;
    background: #f4f6fa;
    font-size: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { max-width: 1200px; margin: auto; padding: 34px 24px 48px; }
  header { margin-bottom: 22px; }
  .brand { color: #3654a1; font-size: .92rem; font-weight: 700; }
  h1 { margin: 6px 0 8px; font-size: 2.25rem; line-height: 1.2; }
  h2 { margin: 0 0 10px; font-size: 1.25rem; }
  h3 { margin: 0; font-size: 1rem; }
  p { margin: 0; }
  .muted, time, .event-code { color: #52637c; }
  .overview { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 14px; }
  .overview span { font-variant-numeric: tabular-nums; }
  .panes { display: grid; grid-template-columns: minmax(300px, 355px) minmax(0, 1fr); gap: 16px; }
  .panel { min-width: 0; background: #fff; border: 1px solid #dce4ef; border-radius: 12px; }
  .pane-header { padding: 16px; border-bottom: 1px solid #e8edf4; }
  .filters { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 8px; }
  input, select {
    width: 100%; min-width: 0; padding: 8px 10px; border: 1px solid #bcc9da;
    border-radius: 6px; background: #fff; color: inherit; font: inherit;
  }
  #tasks, #events { overflow: auto; max-height: 67vh; }
  .task {
    display: grid; grid-template-columns: 1fr auto; align-items: start; width: 100%;
    gap: 3px 8px; text-align: left; padding: 11px 16px; border: 0;
    border-bottom: 1px solid #eef2f7; background: #fff; color: inherit; cursor: pointer;
  }
  .task:hover { background: #f4f7fc; }
  .task[aria-pressed="true"] { background: #ecf2ff; box-shadow: inset 3px 0 #345ed0; }
  .task small { color: #52637c; }
  .badge { padding: 2px 7px; border-radius: 5px; font-size: .85rem; font-weight: 650; }
  .SUCCEEDED { background: #e4f4ec; color: #11623c; }
  .FAILED { background: #fcebed; color: #a62c3c; }
  .CANCELLED { background: #edf0f5; color: #47556c; }
  .selected-summary { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; }
  .selected-summary h2 { margin: 0; }
  #detail-meta { margin-top: 8px; font-size: .94rem; }
  #event-filter { margin-top: 12px; }
  #events { list-style: none; margin: 0; padding: 0 16px; }
  .event {
    display: grid; grid-template-columns: 3.25rem minmax(0, 1fr) auto; gap: 8px;
    align-items: start; border-bottom: 1px solid #eef2f7; padding: 11px 0;
  }
  .event-code, .event-number { font-family: ui-monospace, Consolas, monospace; font-size: .83rem; }
  .event-code { display: block; margin-top: 3px; overflow-wrap: anywhere; }
  .event-number, time { font-variant-numeric: tabular-nums; }
  details { grid-column: 2 / -1; color: #47556c; }
  summary { cursor: pointer; font-size: .87rem; }
  pre { padding: 10px; border-radius: 7px; background: #f5f7fb; white-space: pre-wrap; overflow-wrap: anywhere; }
  .empty { padding: 16px; color: #52637c; }
  :focus-visible { outline: 2px solid #345ed0; outline-offset: -2px; }
  @media (max-width: 720px) {
    main { padding: 22px 12px 36px; }
    .panes { grid-template-columns: 1fr; }
    #tasks { max-height: 35vh; }
    #events { max-height: none; }
  }
</style>
</head>

<script>
"use strict";
const archive = JSON.parse(document.getElementById("history-data").textContent);
const get = id => document.getElementById(id);
const taskList = get("tasks");
const eventList = get("events");
const taskFilter = get("task-filter");
const stateFilter = get("state-filter");
const eventFilter = get("event-filter");
let selectedTask = archive.tasks[0];

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function seconds(milliseconds) {
  return (milliseconds / 1000).toFixed(2) + " 秒";
}

function summary() {
  const count = archive.tasks.length;
  const eventCount = archive.tasks.reduce((sum, task) => sum + task.events.length, 0);
  get("overview").replaceChildren(
    element("span", count + " 条任务"),
    element("span", eventCount.toLocaleString("zh-CN") + " 条事件"),
    ...["SUCCEEDED", "FAILED", "CANCELLED"].map(state =>
      element("span", archive.states[state] + " " + archive.tasks.filter(task => task.state === state).length)
    )
  );
}

function renderTasks() {
  const query = taskFilter.value.trim().toLowerCase();
  const visible = archive.tasks.filter(task =>
    (!stateFilter.value || task.state === stateFilter.value) &&
    [task.id, task.backend, task.date, archive.kinds[task.kind]].join(" ").toLowerCase().includes(query)
  );
  if (!visible.includes(selectedTask)) selectedTask = visible[0] || null;
  const rows = visible.map(task => {
    const row = element("button", undefined, "task");
    row.type = "button";
    row.setAttribute("aria-pressed", String(selectedTask === task));
    row.append(
      element("strong", task.id + " · " + archive.kinds[task.kind]),
      element("span", archive.states[task.state], "badge " + task.state),
      element("small", task.date + " · " + (task.backend || "默认后端")),
      element("small", task.events.length + " 条事件")
    );
    row.addEventListener("click", () => {
      selectedTask = task;
      for (const button of taskList.children) button.setAttribute("aria-pressed", String(button === row));
      eventFilter.value = "";
      renderDetail();
    });
    return row;
  });
  taskList.replaceChildren(...(rows.length ? rows : [element("p", "当前条件下没有任务。", "empty")]));
  renderDetail();
}

function renderDetail() {
  const state = get("detail-state");
  const heading = get("detail-heading");
  const meta = get("detail-meta");
  const empty = get("empty-events");
  state.className = selectedTask ? "badge " + selectedTask.state : "";
  state.textContent = selectedTask ? archive.states[selectedTask.state] : "";
  heading.textContent = selectedTask ? selectedTask.id + " 执行时间线" : "执行时间线";
  eventFilter.disabled = !selectedTask;
  if (!selectedTask) {
    meta.textContent = "";
    empty.hidden = false;
    eventList.replaceChildren();
    return;
  }
  const task = selectedTask;
  const metadata = [task.date, seconds(task.elapsedMs), task.events.length + " 条事件"];
  if (task.verification !== null) metadata.push("验证" + (task.verification ? "通过" : "失败"));
  if (task.acceptance !== null) metadata.push("验收" + (task.acceptance ? "通过" : "失败"));
  meta.textContent = metadata.join(" · ");
  const query = eventFilter.value.trim().toLowerCase();
  const events = task.events.filter(([, type]) =>
    (type + " " + archive.eventNames[type]).toLowerCase().includes(query)
  );
  empty.hidden = events.length > 0;
  eventList.replaceChildren(...events.map(([seq, type, elapsed, fields]) => {
    const item = element("li", undefined, "event");
    const name = element("div");
    name.append(element("h3", archive.eventNames[type]), element("small", type, "event-code"));
    item.append(element("span", "#" + seq, "event-number muted"), name, element("time", "+" + seconds(elapsed)));
    if (Object.keys(fields).length) {
      const details = element("details");
      details.append(element("summary", "事件信息"), element("pre", JSON.stringify(fields, null, 2)));
      item.append(details);
    }
    return item;
  }));
}

taskFilter.addEventListener("input", renderTasks);
stateFilter.addEventListener("change", renderTasks);
eventFilter.addEventListener("input", renderDetail);
summary();
renderTasks();
</script>
