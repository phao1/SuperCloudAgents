name: Source mode

on:
  push:
    branches: [evolve, 'supercloudagent*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Disable Git line ending conversion
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare Linux PostgreSQL
        if: runner.os == 'Linux'
        run: |
          if ! compgen -G '/usr/lib/postgresql/*/bin/initdb' > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql
          fi
      - name: Prepare macOS PostgreSQL and GNU tools
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@16 coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install SCA with test dependencies
        id: install
        shell: bash
        run: |
          python -m venv .venv
          sca_python=.venv/bin/python
          if [[ "$RUNNER_OS" == Windows ]]; then sca_python=.venv/Scripts/python.exe; fi
          echo "SCA_PYTHON=$sca_python" >> "$GITHUB_ENV"
          "$sca_python" -m pip install -q -e '.[dev]'

      - name: Run unit tests
        shell: bash
        run: |
          "$SCA_PYTHON" - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path
          from sca.host import remove_tree

          temp = Path.cwd() / ".pytest-tmp"
          try:
              subprocess.run([sys.executable, "-m", "pytest", "tests/unit", "-q",
                              f"--basetemp={temp}", "-p", "no:cacheprovider"],
                             check=True, timeout=540)
          finally:
              if temp.exists():
                  if os.name != "nt":
                      for folder, _, _ in os.walk(temp):
                          Path(folder).chmod(0o700)
                  remove_tree(temp)
          PY

      - name: Smoke test Windows source mode
        if: ${{ !cancelled() && steps.install.outcome == 'success' && runner.os == 'Windows' }}
        shell: powershell
        run: |
          $env:PORTAL_TOKEN = [Guid]::NewGuid().ToString('N')
          & .\scripts\portal_source.ps1 up
          if ($LASTEXITCODE -ne 0) { throw 'Windows source startup failed' }
          & .\.venv\Scripts\python.exe scripts/source_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows source smoke failed' }

      - name: Smoke test POSIX source mode
        if: ${{ !cancelled() && steps.install.outcome == 'success' && runner.os != 'Windows' }}
        shell: bash
        run: |
          export PORTAL_TOKEN=$("$SCA_PYTHON" -c 'import secrets; print(secrets.token_hex(32))')
          bash scripts/portal_source.sh up
          "$SCA_PYTHON" scripts/source_smoke.py

      - name: Stop Windows source services
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          .\scripts\portal_source.ps1 down
          if ($LASTEXITCODE -ne 0) { throw 'Windows source shutdown failed' }

      - name: Stop POSIX source services
        if: always() && runner.os != 'Windows'
        run: bash scripts/portal_source.sh down

      - name: Collect source service logs
        id: smoke-logs
        if: failure() && steps.install.outcome == 'success'
        shell: bash
        run: |
          "$SCA_PYTHON" - <<'PY'
          import os
          import re
          from pathlib import Path

          from sca.secrets import redact

          output = Path(os.environ["RUNNER_TEMP"]) / "source-smoke-logs"
          output.mkdir(exist_ok=True)
          # The smoke generates hex credentials for the Portal, gateway and PostgreSQL.
          token = re.compile(r"(?i)dev-token|(?:sk-)?(?:[0-9a-f]{64}|[0-9a-f]{32})")
          for name in ("api", "worker", "postgres", "postgres-server", "temporal",
                       "litellm", "setup", "migrations", "dsh"):
              log = Path(".data/run") / f"{name}.log"
              if not log.is_symlink() and log.is_file():
                  content = log.read_text(encoding="utf-8", errors="replace")
                  (output / log.name).write_text(token.sub("[redacted]", redact(content)), encoding="utf-8")
          PY

      - name: Upload source service logs
        if: failure() && steps.smoke-logs.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: source-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/source-smoke-logs/*.log
