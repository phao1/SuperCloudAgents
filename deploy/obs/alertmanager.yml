route:
  receiver: webhook
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: webhook
      repeat_interval: 1h
    - matchers: ['severity="warning"']
      receiver: webhook

inhibit_rules:
  - source_matchers: ['alertname="ScaWorkerDown"', 'severity="critical"']
    target_matchers:
      - 'alertname=~"ScaTaskStuck|ScaActivityRetryStorm"'
      - 'severity=~"critical|warning"'

receivers:
  - name: webhook
    webhook_configs:
      - url_file: /etc/alertmanager/alert-webhook-url
        send_resolved: true

