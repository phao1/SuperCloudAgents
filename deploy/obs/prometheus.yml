# Prometheus for a local SuperCloudAgents (compose profile `obs`, host network).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: ["/etc/prometheus/alerts.yml"]
scrape_configs:
  - job_name: sca-api
    static_configs: [{targets: ["localhost:8000"]}]
  - job_name: sca-worker  # Temporal SDK metrics (SCA_WORKER_METRICS_PORT)
    static_configs: [{targets: ["localhost:9464"]}]
  - job_name: sca-worker-tasks
    static_configs: [{targets: ["localhost:9465"]}]
