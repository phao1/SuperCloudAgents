name: sca
services:
  openbao:
    image: openbao/openbao:2.4.3
    profiles: [openbao]
    command: server -dev -dev-listen-address=0.0.0.0:8200
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_DEV_ROOT_TOKEN:-sca-dev-root}
    ports:
      - "127.0.0.1:8200:8200"
    mem_limit: 200m

  postgres:
    # pgvector build of Postgres 16 (memory retrieval, ADR-11); plain Postgres also works, the
    # vector migration is skipped and retrieval falls back to recency.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sca
      POSTGRES_PASSWORD: sca
      POSTGRES_DB: sca
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sca -d sca"]
      interval: 2s
      timeout: 3s
      retries: 30

  temporal:
    image: temporalio/temporal:latest
    user: "0:0"  # the named volume is root-owned
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]
    volumes: ["temporaldata:/data"]

  # Temporal with Postgres persistence (phase 2), in place of the dev server above.
  # Profile: temporal-pg. Listens on 7234 so both can run side by side; point the platform at
  # it with SCA_TEMPORAL_ADDRESS=localhost:7234.
  temporal-pg:
    profiles: ["temporal-pg"]
    image: temporalio/auto-setup:latest
    container_name: sca-temporal-pg
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: sca
      POSTGRES_PWD: sca
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports: ["127.0.0.1:7234:7233"]
    mem_limit: 700m
    depends_on:
      postgres: {condition: service_healthy}

  # Model gateway (phase 2). Start with: docker compose --profile gateway up -d
  litellm:
    profiles: ["gateway"]
    image: ghcr.io/berriai/litellm:main-stable
    container_name: sca-litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: ["../.env"]  # provider keys and LITELLM_MASTER_KEY; never committed
    environment:
      DATABASE_URL: postgresql://sca:sca@postgres:5432/litellm
    ports: ["127.0.0.1:4000:4000"]
    volumes: ["${SCA_LITELLM_CONFIG:-./litellm/config.yaml}:/app/config.yaml:ro"]
    mem_limit: 900m
    depends_on:
      postgres: {condition: service_healthy}

  # S3-compatible object store (phase 2). Profile: s3
  seaweedfs:
    profiles: ["s3"]
    image: chrislusf/seaweedfs:latest
    container_name: sca-seaweedfs
    command: ["server", "-s3", "-dir=/data", "-volume.max=100", "-master.volumeSizeLimitMB=256"]
    ports: ["127.0.0.1:8333:8333"]
    volumes: ["s3data:/data"]
    mem_limit: 400m

  # OIDC provider (phase 2). Profile: oidc
  dex:
    profiles: ["oidc"]
    image: ghcr.io/dexidp/dex:latest
    container_name: sca-dex
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports: ["127.0.0.1:5556:5556"]
    volumes: ["./dex/config.yaml:/etc/dex/config.yaml:ro"]
    mem_limit: 200m

  # Local Git hosting with Actions (phase 2b: real CI, private repositories). Profile: gitea.
  # Set up with deploy/gitea/setup.sh, which also registers the runner.
  gitea:
    profiles: ["gitea"]
    image: gitea/gitea:1.22
    container_name: sca-gitea
    restart: unless-stopped
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://localhost:3000/
      GITEA__server__SSH_DISABLE: "true"
      GITEA__actions__ENABLED: "true"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__service__DISABLE_REGISTRATION: "true"
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["giteadata:/data"]
    mem_limit: 300m

  gitea-runner:
    profiles: ["gitea"]
    build: {context: ./gitea, dockerfile: runner.Dockerfile}
    image: sca-gitea-runner:latest
    container_name: sca-gitea-runner
    restart: unless-stopped  # it exits if Gitea is not up yet
    network_mode: host  # jobs reach Gitea and the platform API on localhost
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: http://localhost:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_TOKEN:-}
      GITEA_RUNNER_NAME: sca-local
    volumes: ["./gitea/runner.yaml:/config.yaml:ro", "gitearunner:/data"]
    mem_limit: 300m
    depends_on: [gitea]

  # Observability backends (phase 2b). Profile: obs. Host network so they reach the API and
  # worker metrics on localhost and the platform reaches Jaeger's OTLP endpoint on :4318.
  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v2.53.2
    container_name: sca-prometheus
    network_mode: host
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d",
              "--web.listen-address=127.0.0.1:9090"]
    volumes: ["./obs/prometheus.yml:/etc/prometheus/prometheus.yml:ro",
              "./obs/alerts.yml:/etc/prometheus/alerts.yml:ro"]
    mem_limit: 300m

  alertmanager:
    profiles: ["obs"]
    image: prom/alertmanager:v0.27.0
    container_name: sca-alertmanager
    network_mode: host
    command: ["--config.file=/etc/alertmanager/alertmanager.yml",
              "--web.listen-address=127.0.0.1:9093", "--cluster.listen-address="]
    volumes: ["./obs/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro",
              "../.data/obs/alert-webhook-url:/etc/alertmanager/alert-webhook-url:ro"]
    mem_limit: 100m

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.2.0
    container_name: sca-grafana
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3001"  # 3000 is Gitea
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes: ["./obs/grafana/provisioning:/etc/grafana/provisioning:ro",
              "./obs/grafana/dashboards:/var/lib/grafana/dashboards:ro"]
    mem_limit: 250m

  jaeger:
    profiles: ["obs"]
    image: jaegertracing/all-in-one:1.60
    container_name: sca-jaeger
    network_mode: host
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "20000"
    mem_limit: 300m

volumes:
  pgdata:
  temporaldata:
  s3data:
  giteadata:
  gitearunner:
