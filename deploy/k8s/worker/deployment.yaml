apiVersion: apps/v1
kind: Deployment
metadata:
  name: sca-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sca-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sca-worker
    spec:
      serviceAccountName: sca-worker
      terminationGracePeriodSeconds: 660
      containers:
        - name: worker
          image: sca:latest
          # The current CLI has no `sca worker` subcommand.
          command: [python, -m, sca.orchestration.worker]
          envFrom:
            - configMapRef:
                name: sca-worker
            - secretRef:
                name: sca-worker
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            # Both metrics servers bind loopback; a Pod-IP HTTP probe cannot reach them.
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9465/metrics', timeout=2).close()"
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/sca
      volumes:
        - name: data
          emptyDir: {}
