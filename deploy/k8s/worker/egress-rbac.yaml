apiVersion: v1
kind: Namespace
metadata:
  name: sca-sandboxes
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sca-worker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sca-egress-ca
  namespace: sca-sandboxes
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, update]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sca-egress-ca
  namespace: sca-sandboxes
subjects:
  - kind: ServiceAccount
    name: sca-worker
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sca-egress-ca
