apiVersion: v1
kind: ConfigMap
metadata:
  name: sca-worker
data:
  SCA_STATE_TRANSPORT: sync
  SCA_OBJECT_STORE: s3
  SCA_SANDBOX_DRIVER: k8s
  SCA_K8S_NAMESPACE: sca-sandboxes
  SCA_TEMPORAL_ADDRESS: temporal-frontend.temporal.svc.cluster.local:7233
  SCA_TEMPORAL_NAMESPACE: default
  SCA_TASK_QUEUE: sca-coding
  SCA_S3_BUCKET: REPLACE_ME
  SCA_S3_ENDPOINT_URL: https://REPLACE_ME.invalid
  SCA_S3_REGION: us-east-1
  SCA_DATA_DIR: /var/lib/sca
  SCA_WORKER_METRICS_PORT: "9464"
  SCA_TURN_HEARTBEAT_TIMEOUT_S: "120"
  # Use fake until a credential-safe Kubernetes agent setup is available.
  SCA_AGENT_BACKEND: fake
